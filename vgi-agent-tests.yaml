#
# Private graders for the tasks published in `vgi.agent_test_tasks`.
#
# The catalog tag carries only {name, prompt} — the question an analyst asks.
# The canonical answer lives here, outside the catalog, so an agent being
# measured by `vgi-lint simulate` cannot read the answer key out of the very
# worker it is querying (VGI416).
#
# `simulate` attaches ONLY this worker, which exposes six table functions, one
# scalar and no tables besides `models`. Every reference query must therefore be
# self-contained: supply its own
# rows with VALUES or a literal — `models()` is the one exception, because its
# rows come from the API rather than from the query. A reference that selects
# from a table the analyst does not have cannot run, and a grader that cannot
# run grades nothing. tests/test_examples.py executes every one of these.
tasks:
  - name: route_a_support_ticket
    reference_sql: >-
      SELECT choice, confidence FROM typesafe.main.choice(
      'My package never arrived and the tracking has not updated in a week.',
      instructions => 'Which team should handle this?',
      criteria => MAP {'shipping': 'Delivery status, delays, lost packages',
      'billing': 'Charges, invoices, payment problems',
      'returns': 'Exchanges, refunds, damaged items'})
    success_criteria: >-
      Uses typesafe.main.choice for the single question, chooses shipping, and reports the
      confidence column alongside the chosen option.
    unordered: true

  - name: several_judgments_one_request
    reference_sql: >-
      SELECT a.dept.choice, a.angry.noul, a.severity.score FROM typesafe.main.ask(
      'I was charged twice and nobody has replied to me in three days',
      questions => {'dept': {'type': 'choice', 'instructions': 'Which team should handle this?',
      'criteria': {'shipping': 'Delivery status, delays, lost packages',
      'billing': 'Charges, invoices, payment problems'}},
      'angry': {'type': 'noul', 'instructions': 'Is the customer angry?'},
      'severity': {'type': 'score', 'instructions': 'How severe is this?',
      'criteria': ['minor question', 'disruptive delay', 'critical outage']}}) a
    success_criteria: >-
      Uses a SINGLE typesafe.main.ask call carrying all three questions rather than three separate
      calls, and reads each answer out of its own struct column.
    unordered: true

  - name: ask_each_row_its_own_question
    reference_sql: >-
      SELECT t.id, a.answers->'dept'->>'choice' AS dept, a.answers->'urgent'->>'noul' AS urgent
      FROM (VALUES (1, 'My package is lost and delivery is delayed',
      '{"dept": {"type": "choice", "instructions": "Which team should handle this?",
      "criteria": {"shipping": "Delivery status, delays, lost packages",
      "billing": "Charges, invoices, payment problems"}}}'),
      (2, 'Thanks, just one routine question',
      '{"urgent": {"type": "noul", "instructions": "Does this need a reply today?"}}'))
      t(id, body, questions),
      LATERAL typesafe.main.ask_dynamic(t.body, t.questions) a
      ORDER BY t.id
    success_criteria: >-
      Uses typesafe.main.ask_dynamic with the questions arriving as a per-row column rather than
      one fixed set for the whole query, and reads the wanted value out of the JSON answers column
      with DuckDB's JSON operators. A single typesafe.main.ask call cannot satisfy this, because
      its questions are fixed when the query is planned.
    unordered: true

  - name: route_only_the_confident_ones
    reference_sql: >-
      SELECT t.body, c.choice FROM (VALUES ('my package is lost in delivery'),
      ('my invoice shows a wrong charge')) t(body),
      LATERAL typesafe.main.choice(t.body, instructions => 'Which team should handle this?',
      criteria => MAP {'shipping': 'Delivery status, delays, lost packages',
      'billing': 'Charges, invoices, payment problems'}) c
      WHERE c.confidence > 0.8
    success_criteria: >-
      Filters on the confidence column rather than accepting every answer. The threshold is a
      judgement call and any reasonable value counts.
    unordered: true

  - name: judge_a_whole_row
    reference_sql: >-
      SELECT t.id, a.urgent.noul FROM (VALUES (1, 'my parcel is lost', 'gold', 'A-104'))
      t(id, message, tier, order_id),
      LATERAL typesafe.main.ask(t, questions =>
      {'urgent': {'type': 'noul', 'instructions': 'Does this need a reply today?'}}) a
    success_criteria: >-
      Passes the whole row (or a struct built from several of its columns) as the state, rather
      than a single text column, so the model sees the columns together.
    unordered: true

  - name: find_out_what_columns_come_back
    reference_sql: >-
      DESCRIBE SELECT * FROM typesafe.main.ask('x', questions =>
      {'dept': {'type': 'choice', 'instructions': 'Which team?',
      'criteria': {'shipping': 'Lost packages', 'billing': 'Invoices'}},
      'urgent': {'type': 'noul', 'instructions': 'Needs a reply today?'}})
    success_criteria: >-
      Uses DESCRIBE (or an equivalent bind-only inspection) to read the result shape without
      issuing a billed request, and reports one struct column per question plus usage.
    unordered: true

  - name: flag_which_messages_need_a_reply
    reference_sql: >-
      SELECT t.body, n.noul FROM (VALUES
      ('My package never arrived and nobody has replied in three days'),
      ('Thanks, just a routine question')) t(body),
      LATERAL typesafe.main.noul(t.body,
      instructions => 'Does this need a reply today?') n
    success_criteria: >-
      Uses typesafe.main.noul (or the is_true scalar) and reports the probability itself rather
      than collapsing it to a yes/no, so the analyst can choose a cut-off afterwards.
    unordered: true

  - name: rate_severity_on_a_scale
    reference_sql: >-
      SELECT score, confidence FROM typesafe.main.score(
      'The whole site is down and no orders can be placed',
      instructions => 'How severe is this?',
      criteria => ['minor question', 'disruptive delay', 'critical outage'])
    success_criteria: >-
      Uses typesafe.main.score with an ordered criteria list running lowest first, rather than a
      choice question over unordered options, and reports the confidence alongside the score.
    unordered: true

  - name: filter_rows_by_a_yes_no_question
    reference_sql: >-
      SELECT t.body FROM (VALUES ('My package never arrived'),
      ('Thanks for the quick refund')) t(body)
      WHERE typesafe.main.is_true(t.body, 'Is this message about a lost package?') > 0.5
    success_criteria: >-
      Calls typesafe.main.is_true directly in the WHERE clause and compares it against a
      threshold, rather than joining a table function in. The threshold is a judgement call and
      any reasonable value counts.
    unordered: true

  - name: which_models_can_i_ask_for
    reference_sql: >-
      SELECT name, description, release_date FROM typesafe.main.models() ORDER BY name
    success_criteria: >-
      Calls typesafe.main.models() rather than guessing model names or quoting documentation,
      and reports each model's name together with its release date.
    unordered: true

name: Release

# On a published GitHub Release: gate on the full test suite (ci.yml), build the sdist +
# wheel, and attach them to the Release. VGI workers are not published to PyPI; users
# install from the GitHub Release (or the ghcr.io image).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build + attach distributions
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the Release
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check version matches tag
        if: github.event_name == 'release'
        run: ci/check-version.sh "${{ github.event.release.tag_name }}"
      - name: Build sdist + wheel
        run: uv build --no-sources --sdist --wheel --out-dir dist .
      - name: Validate metadata
        run: uvx twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach distributions to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

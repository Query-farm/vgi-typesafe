name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml gates a release on this whole suite via `uses: ./.github/workflows/ci.yml`.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pyproject deliberately carries no `[tool.uv.sources]`, so a fresh clone
  # resolves from PyPI. This pins that shut: if a local path source is ever
  # added, CI still proves the *published* dependencies are sufficient. The
  # entry scripts carry their own PEP-723 headers, and a missing one shipped a
  # worker that only ran from the author's project directory.
  UV_NO_SOURCES: "1"

jobs:
  check:
    name: Lint, types, offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-sources --all-extras
      - name: Ruff (lint)
        run: uv run --no-sources ruff check .
      - name: Ruff (format)
        run: uv run --no-sources ruff format --check .
      - name: Mypy (strict)
        run: uv run --no-sources mypy vgi_typesafe/
      # Docstring consistency (pydoclint) runs inside the pytest suite via
      # tests/test_docstrings.py, so it is not a separate step here.
      - name: Offline tests
        run: uv run --no-sources pytest -q
      # The gate the other 200-odd tests structurally cannot be: they all run
      # inside a synced venv from the project root, which is precisely where a
      # broken entry script still works.
      - name: Entry points run with no project and no dev checkout
        run: |
          cd "$(mktemp -d)"
          uv run --no-project "$GITHUB_WORKSPACE/typesafe_worker.py" --help > /dev/null
          uv run --no-project "$GITHUB_WORKSPACE/serve.py" --help > /dev/null

  catalog:
    name: Catalog metadata (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-sources --all-extras
      # The BEHAVIOURAL tier (VGI9xx), not just the structural one. It attaches
      # the worker and DESCRIBEs/runs the shipped examples, which is how it
      # checks a declared result schema against what a function really returns
      # — nothing the structural tier can see. `--no-execute` was cheaper and
      # missed exactly that.
      #
      # Pointing the worker at the bundled mock through its own environment
      # fallback keeps this free and keyless: no example is billed, and CI
      # never needs the production key. --audit-waivers re-runs the rules our
      # waiver silences and fails if it has stopped buying anything.
      - name: vgi-lint (structural + behavioural, against the mock)
        run: |
          uv run --no-sources vgi-typesafe-mock --port 8787 --api-key ci-key &
          mock_pid=$!
          # Stop it however this step ends. Left running, it holds the uv cache
          # lock and the post-job `uv cache prune --ci` deadlocks for 300s and
          # fails the job — with the lint itself already green.
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -sf -o /dev/null -X POST http://127.0.0.1:8787/ && break
            sleep 0.2
          done
          TYPESAFE_API_KEY=ci-key TYPESAFE_BASE_URL=http://127.0.0.1:8787 \
            uvx --no-sources --from vgi-lint-check vgi-lint lint \
              --execute --audit-waivers --no-check-links
